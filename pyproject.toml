[project]
name = "incommodities-ta"
version = "0.1.0"
description = "Forward power position tool for a Japanese electricity retailer trading desk"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0",
    "rich>=13.0",
    "streamlit>=1.65.0",
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "numpy>=2.0",
    "pytest>=8.0",
    "pytest-benchmark>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Transcribed specification tables stay readable as one row per line.
"tests/builders.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "unit: isolated tests of a single core component (no filesystem, no clock)",
    "integration: tests spanning a boundary (CSV parsing, rendering)",
    "e2e: full application invocation",
    "bench: performance measurement, not a correctness gate",
]
